# ggml (and its CPU/BLAS/CUDA/Metal backends) comes from libllama, so this
# feedstock has no BLAS / GPU variant matrix of its own.

# win-arm64 uses clang, as upstream's cmake/arm64-windows-llvm.cmake and libllama do.
# 20.1.8 matches the clang/llvm-openmp generation libllama was built with.
c_compiler:                    # [win and arm64]
  - clang                      # [win and arm64]
cxx_compiler:                  # [win and arm64]
  - clang                      # [win and arm64]
c_compiler_version:            # [win and arm64]
  - 20.1.8                     # [win and arm64]
cxx_compiler_version:          # [win and arm64]
  - 20.1.8                     # [win and arm64]
